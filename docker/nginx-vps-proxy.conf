# Nginx reverse proxy configuration for Portfolio
# This file should be placed at: /etc/nginx/sites-available/portfolio
# Then symlinked to: /etc/nginx/sites-enabled/portfolio
#
# BEFORE running Certbot, use only the HTTP (port 80) section below.
# AFTER running Certbot, it will automatically add the SSL configuration.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.danishdave.com;

    location / {
        proxy_pass http://localhost:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through cache headers from the backend
        proxy_pass_header Cache-Control;
        proxy_pass_header Expires;

        # Don't add cache headers at the proxy level - let backend control it
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header X-Powered-By;
    }

    # Increase timeouts for long-running requests
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    client_max_body_size 100M;
}

# After running Certbot, the SSL configuration will be added automatically below
