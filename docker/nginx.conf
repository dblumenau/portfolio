server {
    listen 8080;
    server_name _;
    root /app/public;

    # Allow large file uploads
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache versioned assets (Vite builds) for 1 year - they have content hashes
    # ^~ modifier stops regex location matching, preventing the .css/.js pattern below from interfering
    location ^~ /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache other static assets for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|css|js|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Don't cache PHP responses - always validate
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Increase buffer sizes for large responses
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Increase timeouts for long-running requests
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
}
