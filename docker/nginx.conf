map $uri $portfolio_cache_control {
    default "no-cache";
    ~^/_astro/ "public, max-age=31536000, immutable";
    ~^/media/ "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $portfolio_cache_control;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    location = /en { return 301 /; }
    location = /en/ { return 301 /; }
    location = /da { return 301 /; }
    location = /da/ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        try_files $uri =404;
    }

    location /media/ {
        try_files $uri =404;
    }

    location ~ \.vtt$ {
        types { text/vtt vtt; }
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
