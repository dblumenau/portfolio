version: '3.8'

services:
  app:
    image: ghcr.io/dblumenau/portfolio:latest
    container_name: portfolio-app
    restart: always
    ports:
      - "8091:8080"
    env_file:
      - .env.production
    volumes:
      - ./database/database.sqlite:/app/database/database.sqlite
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
