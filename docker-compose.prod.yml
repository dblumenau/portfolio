services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:?Set PORTFOLIO_IMAGE to a reviewed, immutable local image tag}
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
